# Caddy가 SSL + HTTP→HTTPS 리다이렉트를 처리함
# nginx는 내부 라우팅만 담당 (HTTP only)

# Caddy → Nginx 구간 실제 클라이언트 IP 복원 (Docker 내부 사설망에서 온 X-Forwarded-For만 신뢰)
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Rate Limiting 존 (IP 기준)
limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=5r/m;
limit_req_zone $binary_remote_addr zone=reissue_limit:5m rate=10r/m;
limit_req_zone $binary_remote_addr zone=search_limit:5m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# SNS 링크 미리보기 봇 User-Agent 감지 (OG 메타 태그 서빙용)
# 검색 엔진(Googlebot, Yeti 등)은 제외: 일반 사용자와 같은 SPA를 받아야 색인·광고 심사가 가능함
map $http_user_agent $is_crawler {
    default                                                    0;
    ~*(twitterbot|facebookexternalhit|facebookcatalog)         1;
    ~*(kakaotalk)                                              1;
    ~*(linkedinbot|whatsapp|telegrambot|discordbot|slackbot)   1;
}

server {
    listen 80;
    server_name ps-signal.com www.ps-signal.com;

    # 에러 페이지·응답 헤더에 Nginx 버전 노출 안 함
    server_tokens off;

    # 다른 사이트가 iframe으로 삽입하는 것을 차단 (클릭재킹 방지)
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Game detail: SNS 크롤러는 백엔드 OG 엔드포인트로, 일반 사용자는 SPA
    location ~ ^/games/(\d+)$ {
        root /usr/share/nginx/html;
        if ($is_crawler) {
            rewrite ^/games/(\d+)$ /api/og/game/$1 last;
        }
        try_files $uri /index.html;
        expires epoch;
    }

    # 게임 상세 sitemap: catalog-service가 DB 기준으로 생성
    location = /sitemap-games.xml {
        proxy_pass http://catalog-service:8080/api/seo/sitemap-games.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 빌드 산출물(파일명에 해시 포함): 장기 캐시, 없는 파일은 index.html 대신 404
    # (add_header를 쓰면 server 레벨 보안 헤더 상속이 끊기므로 expires 지시어 사용)
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires max;
    }

    # 1. 프론트엔드 (React) — index.html은 매번 재검증해 새 배포를 즉시 반영
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        expires epoch;
    }

    # 2. 백엔드 API (경로별 차등 Rate Limiting 적용)
    # SNS 미리보기 OG 엔드포인트는 봇 공유 트래픽 보호를 위해 제한 제외
    location /api/og/ {
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 인증 API (BCrypt CPU 보호 및 브루트포스·가입 스팸 방어)
    location = /api/v1/auth/login {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/v1/members/signup {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 토큰 재발급 API (다중 탭·공유 IP Silent Refresh 허용 + 무한 재발급 루프 차단)
    location = /api/v1/auth/reissue {
        limit_req zone=reissue_limit burst=10 nodelay;
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 검색·자동완성 API (풀스캔 DB 부하 방어)
    location = /api/v1/games/search {
        limit_req zone=search_limit burst=15 nodelay;
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /api/v1/games/suggest {
        limit_req zone=search_limit burst=15 nodelay;
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 일반 백엔드 API (SPA 초기 동시 요청 및 모바일 공유 IP 감안)
    location /api {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 3. OAuth2 요청 (/oauth2/authorization/google)
    location /oauth2 {
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 4. OAuth2 콜백 (/login/oauth2/code/google)
    location /login {
        proxy_pass http://catalog-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # 내부 서비스(크롤러) 전용 API는 외부 도메인에서 원천 차단 (크롤러는 OCI 내부망으로 직접 통신)
    location /api/internal {
        return 404;
    }

    location = /api/v1/games/collect {
        return 404;
    }

    location = /api/v1/games/targets {
        return 404;
    }

    location = /api/v1/games/batch-complete {
        return 404;
    }

    location = /api/v1/subscriptions/ps-plus/collect {
        return 404;
    }

    location = /api/v1/subscriptions/benefits/collect {
        return 404;
    }

    # Actuator(헬스체크·메트릭)는 외부 비공개
    # Alloy는 내부 네트워크(catalog-service:8080)로, Docker healthcheck는 컨테이너 내부 localhost로 직접 접근함
    location /actuator {
        return 404;
    }
}