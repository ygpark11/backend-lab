version: '3.8'
services:
  # 1. 데이터베이스
  mysql:
    image: mysql:8.0
    container_name: ps-tracker-db
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ps-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Java Backend (Brain)
  catalog-service:
    #build: ./apps/catalog-service/catalog-service
    image: ygpark1334/ps-tracker-api:latest
    container_name: ps-tracker-api
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - SPRING_PROFILES_ACTIVE=prod
      - "JAVA_TOOL_OPTIONS=-Xms512M -Xmx1024M"
      - CRAWLER_PRIMARY_URL=http://10.0.0.61:5000
      - CRAWLER_SECONDARY_URL=http://10.0.0.161:5000
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json
      - ./logs/backend:/var/log/pstracker
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ps-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. Frontend (Face)
  frontend:
    #build: ./apps/frontend
    image: ygpark1334/ps-tracker-web:latest
    container_name: ps-tracker-web
    expose:
      - "80"
    depends_on:
      - catalog-service
    networks:
      - ps-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Caddy (Reverse Proxy + SSL)
  caddy:
    image: caddy:alpine
    container_name: ps-tracker-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
    networks:
      - ps-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. DB 관리 도구
  adminer:
    image: adminer
    container_name: ps-tracker-adminer
    ports:
      - "127.0.0.1:8090:8080"
    networks:
      - ps-network
    restart: unless-stopped

  alloy:
    environment:
      - TZ=Asia/Seoul
    image: grafana/alloy:latest
    container_name: ps-tracker-alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./logs/backend:/var/log/pstracker:ro
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    env_file:
      - .env
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - ps-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: "256M"

  # 7. 경량 검색 엔진 (Meilisearch — 내부 네트워크 전용, 장애 시 API가 MySQL로 자동 폴백)
  meilisearch:
    image: getmeili/meilisearch:v1.57.0
    container_name: ps-tracker-meilisearch
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - MEILI_ENV=production
      - MEILI_NO_ANALYTICS=true
      - MEILI_LOG_LEVEL=WARN
    volumes:
      - meili_data:/meili_data
    networks:
      - ps-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: "384M"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  caddy_data:
  meili_data:

networks:
  ps-network:
    driver: bridge